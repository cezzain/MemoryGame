    saveGame();
  }

  function setPreview(s) {
    const frag = document.createDocumentFragment();
    if (s.id === 'custom') {
      const pool = customPool().slice(0, 3);
      if (!pool.length) {
        ['✏️', '📷'].forEach(e => { const span = document.createElement('span'); span.textContent = e; frag.appendChild(span); });
        return frag;
      }
      pool.forEach(it => frag.appendChild(miniPic(it)));
      return frag;
    }
    (s.preview ? s.preview.split(' ') : s.items.slice(0, 4)).forEach(e => {
      const span = document.createElement('span');
      span.textContent = e;
      frag.appendChild(span);
    });
    return frag;
  }
  function renderSets() {
    radioGroup($('#sets'), SETS, SETS.find(s => s.id === settings.set), (b, s) => {
      const pics = document.createElement('span');
      pics.className = 'set-pics';
      pics.setAttribute('aria-hidden', 'true');
      pics.appendChild(setPreview(s));
      const name = document.createElement('span');
      name.className = 'set-name';
      name.textContent = s.name;
      b.append(pics, name);
      b.setAttribute('aria-label', s.name);
    }, s => {
      settings.set = s.id;
      saveSettingsSoon();
      renderSets();
      renderCustom();
    });
  }
  function renderCounts() {
    radioGroup($('#counts'), COUNTS, settings.count, (b, c) => {
      b.innerHTML = `<b>${c}</b><small>${c / 2} pairs</small>`;
      b.setAttribute('aria-label', `${c} cards, ${c / 2} pairs`);
    }, c => {
      settings.count = c;
      saveSettingsSoon();
      renderCounts();
      updateCustomHint();
    });
  }
  function renderCustom() {
    const box = $('#custom');
    box.hidden = settings.set !== 'custom';
    const ta = $('#custom-text');
    if (document.activeElement !== ta) ta.value = settings.customText;
    renderThumbs();
    updateCustomHint();
  }
  function renderThumbs() {
    const list = $('#thumbs');
    list.textContent = '';
    photos.forEach((p, k) => {
      const li = document.createElement('li');
      const img = new Image();
      img.src = p.src;
      img.alt = `Photo ${k + 1}`;
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.innerHTML = svgX();
      rm.setAttribute('aria-label', `Remove photo ${k + 1}`);
      rm.addEventListener('click', () => {
        photos = photos.filter(x => x.id !== p.id);
        savePhotos();
        renderThumbs();
        updateCustomHint();
        refreshCustomPreview();
      });
      li.append(img, rm);
      list.appendChild(li);
    });
    $('#btn-photos').disabled = photos.length >= MAX_PHOTOS;
  }
  function updateCustomHint() {
    const hint = $('#custom-hint');
    if (!hint) return;
    const have = customPool().length;
    const need = settings.count / 2;
    let msg;
    if (!have) msg = `Add pictures above. A ${settings.count}-card game needs ${need}, and we fill any gaps from Mix of everything.`;
    else if (have < need) msg = `You have ${plural(have, 'picture', 'pictures')}. ${settings.count} cards need ${need}, so we add ${need - have} from Mix of everything.`;
    else if (have === need) msg = `You have exactly the ${need} pictures this game needs.`;
    else msg = `You have ${have} pictures. Each game picks ${need} of them at random.`;
    if (photosVolatile && photos.length) msg += ' Photos will be kept until you close this page, because this browser has no room to save them.';
    if (photos.length >= MAX_PHOTOS) msg += ` That’s the most photos (${MAX_PHOTOS}).`;
    hint.textContent = msg;
  }
  function refreshCustomPreview() {
    const idx = SETS.findIndex(s => s.id === 'custom');
    const btn = $('#sets').children[idx];
    if (!btn) return;
    const pics = btn.querySelector('.set-pics');
    pics.textContent = '';
    pics.appendChild(setPreview(SETS[idx]));
  }

  function downscale(file, size) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          const c = document.createElement('canvas');
          c.width = size;
          c.height = size;
          const g = c.getContext('2d');
          g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
          resolve(c.toDataURL('image/jpeg', 0.82));
        } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
      img.src = url;
    });
  }
  async function addPhotos(files) {
    const room = MAX_PHOTOS - photos.length;
    const list = Array.from(files).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name)).slice(0, room);
    let failed = 0;
    for (const f of list) {
      try {
        const src = await downscale(f, 320);
        photos.push({ id: `p${Date.now().toString(36)}${randInt(1e6).toString(36)}`, src });
      } catch (e) { failed++; }
    }
    savePhotos();
    renderThumbs();
    updateCustomHint();
    refreshCustomPreview();
    if (failed) $('#custom-hint').textContent += ` ${plural(failed, 'photo', 'photos')} couldn’t be opened.`;
  }

  function openSetup() {
    renderSetup();
    $('#setup-keep').hidden = !(game && !game.done && game.moves > 0);
    $('#setup-title').textContent = game && !game.done && game.moves > 0 ? 'Game setup' : 'New game';
    openDialog(el.setup);
    const body = el.setup.querySelector('.sheet-body');
    body.scrollTop = 0;
  }

  /* ---------- Events ---------- */
  function bind() {
    el.board.addEventListener('click', e => {
      const b = e.target.closest('.card');
      if (!b) return;
      Sound.ensure();
      keepAwake();
      tapCard(+b.dataset.i);
    });
    el.table.addEventListener('click', e => {
      if (!e.target.closest('.card') && rt.phase === 'miss') resolveMiss();
    });
    el.board.addEventListener('keydown', e => {
      const b = e.target.closest('.card');
      if (!b) return;
      const i = +b.dataset.i;
      const n = el.board.children.length;
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: rt.cols, ArrowUp: -rt.cols }[e.key];
      if (!step) return;
      const j = i + step;
      if (j >= 0 && j < n) { e.preventDefault(); el.board.children[j].focus(); }
    });
    el.board.addEventListener('animationend', e => {
      if (e.animationName === 'deal') e.target.classList.remove('is-dealing');
      if (e.animationName === 'pop') e.target.classList.remove('is-pop');
      if (e.animationName === 'shake') e.target.classList.remove('is-miss');
    });

    el.sound.addEventListener('click', () => {
      settings.sound = !settings.sound;
      el.sound.setAttribute('aria-pressed', settings.sound ? 'true' : 'false');
      saveSettings();
      if (settings.sound) { Sound.ensure(); Sound.flip(); }
    });
    $('#btn-new').addEventListener('click', () => { Sound.ensure(); openSetup(); });
    $('#setup-close').addEventListener('click', () => closeDialog(el.setup));
    $('#setup-keep').addEventListener('click', () => closeDialog(el.setup));
    $('#setup-deal').addEventListener('click', () => {
      Sound.ensure();
      saveSettings();
      closeDialog(el.setup);
      closeDialog(el.results);
      newGame();
    });
    lightDismiss(el.setup);
    lightDismiss(el.results);
    el.results.addEventListener('close', () => cancelAnimationFrame(confettiRaf));
    $('#res-again').addEventListener('click', () => { closeDialog(el.results); newGame(); });
    $('#res-setup').addEventListener('click', () => { closeDialog(el.results); openSetup(); });

    radioKeys($('#seg-players'));
    radioKeys($('#sets'));
    radioKeys($('#counts'));
    $('#rule-again').addEventListener('change', e => { settings.again = e.target.checked; saveSettingsSoon(); });
    $('#rule-peek').addEventListener('change', e => { settings.peek = e.target.checked; saveSettingsSoon(); });
    $('#custom-text').addEventListener('input', e => {
      settings.customText = e.target.value.slice(0, 1000);
      saveSettingsSoon();
      updateCustomHint();
      refreshCustomPreview();
    });
    $('#btn-photos').addEventListener('click', () => $('#photo-input').click());
    $('#photo-input').addEventListener('change', e => {
      const files = e.target.files;
      if (files && files.length) addPhotos(files).finally(() => { e.target.value = ''; });
    });

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(scheduleLayout);
      ro.observe(el.table);
      ro.observe(el.players);
    }
    window.addEventListener('resize', scheduleLayout);
    window.addEventListener('orientationchange', () => setTimeout(scheduleLayout, 250));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout).catch(() => {});

    document.addEventListener('visibilitychange', () => {
      if (!game) return;
      if (document.visibilityState === 'hidden') {
        stopClock();
        saveGame();
      } else {
        if (game.started && !game.done && game.players.length === 1) startClock();
        if (game.started && !game.done) keepAwake();
      }
    });
    window.addEventListener('pagehide', saveGame);
  }

  /* ---------- Boot ---------- */
  function boot(data) {
    const loaded = loadSettings();
    settings = loaded.settings;
    photos = loadPhotos();
    el.sound.setAttribute('aria-pressed', settings.sound ? 'true' : 'false');
    bind();
    const saved = (data && data.game) || store.get(KEYS.game, null);
    const resumed = saved && restoreGame(saved);
    if (!resumed) newGame({ quiet: loaded.fresh });
    else if (game.started && !game.done && game.players.length === 1) startClock();
    if (loaded.fresh) openSetup();
    if (game.done) updateStatus();
  }

  // Exposed for tests and for keeping a game across live updates of the page.
  window.PairPals = {
    get game() { return game; },
    get settings() { return settings; },
    get phase() { return rt.phase; },
    newGame,
    openSetup,
  };
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => ({ game: serializeGame() })); } catch (e) { /* optional */ }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
